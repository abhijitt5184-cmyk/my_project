<!DOCTYPE html>
<html lang="en">
<head>
  
    
    <title>Discovery Land Company </title>
    <style>   
        
        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif; 
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://discoverylandco.com/images/homepage/hero-home.mp4');   
                     background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

  
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            z-index: 10;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }

        
        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .menu-icon span {
            display: block;
            width: 20px;
            height: 1px;
            background-color: #ffffff;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Times New Roman', Times, serif; 
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        
        .logo-icon {
            font-size: 28px;
        }

  
        .hero-content {
            text-align: center;
            margin-top: -50px; /* Slight adjustment to match visual center */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-family: 'Times New Roman', Times, serif; /* Serif font for main heading */
            font-size: 52px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

       
        .selection-box {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-radius: 8px;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .selection-link {
            text-decoration: none;
            color: #333333;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .selection-link:hover {
            color: #666666;
        }

        .btn-locations {
            background-color: transparent;
            border: 1px solid #cccccc;
            color: #333333;
            padding: 10px 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-locations:hover {
            background-color: #f0f0f0;
        }

        .bottom-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            align-items: center;
        }

        .pause-btn {
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
        }

        .scroll-down {
            color: white;
            font-size: 20px;
            cursor: pointer;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        
        <nav class="navbar">
            <div class="nav-left">
                <div class="menu-icon">
                    <span></span>
                    <span></span>
                </div>
                MENU
            </div>
            
            <div class="logo">
                <span class="logo-icon">❂</span> 
                Discovery Land Company
            </div>
            
            <div class="nav-right">
                <span style="font-size: 16px;">⌕</span>
                SEARCH
            </div>
        </nav>

        <main class="hero-content">
            <h1 class="hero-title">DISCOVER YOUR WORLD</h1>
            <p class="hero-subtitle">Select from locations below or scroll to discover more.</p>
            
            <div class="selection-box">
                <a href="#" class="selection-link">Our Worlds</a>
                <a href="#" class="selection-link">Real Estate</a>
                <a href="#" class="selection-link">Experiences</a>
                <button class="btn-locations">LOCATIONS</button>
            </div>
        </main>

        <div class="bottom-controls">
            <button class="pause-btn">||</button>
            <div class="scroll-down">↓</div>
        </div>

    </div>

</body>
</html>
