Here is the combined code. I have placed the CSS inside a `<style>` tag within the HTML's `<head>` section. You can save this entire block as a single `index.html` file and open it in your browser.

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Land Company - Clone</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            height: 100%;
            width: 100%;
        }

        /* Main Container */
        .hero-container {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #ffffff;
        }

        /* Fullscreen Background Video */
        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -2;
            object-fit: cover;
        }

        /* Dark Overlay for Text Readability */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: -1;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .menu-left, .search-right {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-family: "Times New Roman", Times, serif;
            font-size: 1.5rem;
            text-transform: none;
            letter-spacing: 0;
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .compass-icon {
            font-size: 1.8rem;
        }

        /* Main Content (Center) */
        .hero-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 50px;
        }

        .hero-content h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.3);
        }

        .hero-content p {
            font-size: 1rem;
            font-weight: 300;
            margin-bottom: 40px;
            text-shadow: 0px 1px 5px rgba(0,0,0,0.3);
        }

        /* Bottom White Navigation Bar */
        .bottom-nav {
            background-color: #ffffff;
            padding: 10px 10px 10px 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }

        .bottom-nav a {
            text-decoration: none;
            color: #333333;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .bottom-nav a:hover {
            color: #777777;
        }

        .btn-locations {
            border: 1px solid #cccccc;
            padding: 12px 25px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-locations:hover {
            background-color: #f5f5f5;
        }

        /* Bottom Corner Controls */
        .bottom-controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
        }

        .pause-btn, .scroll-arrow {
            pointer-events: auto;
        }

        .pause-btn {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .scroll-arrow {
            font-size: 1.2rem;
            cursor: pointer;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <video autoplay loop muted playsinline class="background-video">
            <source src="https://discoverylandco.com/images/homepage/hero-home.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="video-overlay"></div>

        <header class="top-header">
            <div class="menu-left">
                <span class="icon-line"></span> MENU
            </div>
            <div class="logo">
                <span class="compass-icon">❂</span> Discovery Land Company
            </div>
            <div class="search-right">
                ⚲ SEARCH
            </div>
        </header>

        <main class="hero-content">
            <h1>DISCOVER YOUR WORLD</h1>
            <p>Select from locations below or scroll to discover more.</p>

            <nav class="bottom-nav">
                <a href="#">Our Worlds</a>
                <a href="#">Real Estate</a>
                <a href="#">Experiences</a>
                <a href="#" class="btn-locations">LOCATIONS</a>
            </nav>
        </main>

        <div class="bottom-controls">
            <button class="pause-btn">||</button>
            <div class="scroll-arrow">↓</div>
        </div>
    </div>

</body>
</html>

```
